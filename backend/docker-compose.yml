version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: inkstudio-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: inkstudio
      MYSQL_USER: inkstudio
      MYSQL_PASSWORD: inkstudio_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - inkstudio-network

  backend:
    build: .
    container_name: inkstudio-backend
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: inkstudio
      DB_PASSWORD: inkstudio_password
      DB_NAME: inkstudio
      JWT_SECRET: your-super-secret-jwt-key-change-in-production
      PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - inkstudio-network

volumes:
  mysql_data:

networks:
  inkstudio-network:
    driver: bridge
