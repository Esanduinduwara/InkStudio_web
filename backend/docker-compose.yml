version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: inkstudio-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: inkstudio
      MYSQL_USER: inkstudio_user
      MYSQL_PASSWORD: inkstudio_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: inkstudio-backend
    environment:
      DATABASE_URL: inkstudio_user:inkstudio_pass@tcp(mysql:3306)/inkstudio?parseTime=true&charset=utf8mb4
      JWT_SECRET: your-super-secret-jwt-key-change-in-production
      PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql_data:
